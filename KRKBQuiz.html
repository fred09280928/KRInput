<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Korean 505 · Dubeolsik Practice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #2b3a4a 0%, #1d2a35 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255,255,255,0.3);
            padding: 24px 20px 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2a36;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            color: white;
            font-weight: 600;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            gap: 8px;
            flex-wrap: wrap;
        }

        .home-btn {
            width: 34px; height: 34px; flex: 0 0 auto;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #3a4c5e; text-decoration: none;
            font-size: 1rem; border: 1px solid rgba(255,255,255,0.2);
        }

        .home-btn:hover { background: #4a627a; }

        .weight-box {
            background: #3a4c5e; color: #ffd966; padding: 6px 14px;
            border-radius: 40px; font-size: 1rem; white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .owner-chip {
            font-size: 0.68rem; color: #9db4c7;
            border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
            padding: 3px 9px; white-space: nowrap; font-weight: 500;
        }

        .memo-badge {
            display: flex; align-items: center; gap: 6px;
            background: #2a3e52; border-radius: 40px; padding: 4px 10px;
            max-width: 260px;
        }

        .memo-text {
            font-size: 0.8rem; color: #cfe0ee; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 190px;
        }

        .memo-text.empty { color: #7f95a8; }

        .memo-edit {
            background: #3a4c5e; border: none; color: #fff; cursor: pointer;
            border-radius: 50%; width: 26px; height: 26px; font-size: 0.8rem;
            flex: 0 0 auto;
        }

        .memo-edit:hover { background: #4a627a; }

        /* Memo 編輯視窗 */
        .backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            display: none; align-items: center; justify-content: center;
            padding: 16px; z-index: 50;
        }

        .backdrop.open { display: flex; }

        .modal {
            background: #1e2a36; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 18px; width: 100%; max-width: 420px;
            color: #e8f1f8;
        }

        .modal h2 { font-size: 1rem; margin-bottom: 4px; }
        .modal .sub { font-size: 0.75rem; color: #9db4c7; margin-bottom: 12px; }

        .modal textarea {
            width: 100%; min-height: 96px; border-radius: 12px;
            border: 1px solid #4a627a; background: #2a3e52; color: #eaf2f9;
            padding: 10px; font-size: 0.9rem; resize: vertical;
        }

        .modal .row {
            display: flex; align-items: center; gap: 8px;
            justify-content: flex-end; margin-top: 12px;
        }

        .modal button {
            border: none; border-radius: 10px; padding: 9px 16px;
            font-size: 0.85rem; cursor: pointer;
        }

        #mSave { background: #ffd966; color: #1e2a36; font-weight: 700; }
        #mCancel { background: #3a4c5e; color: #e8f1f8; }
        #mStatus { font-size: 0.72rem; color: #9db4c7; margin-right: auto; }

        .sb-group {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap; min-width: 0;
        }

        @media (max-width: 430px) {
            .sb-group { gap: 6px; }
            .stats-bar { padding: 8px 10px; }
            .home-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .score-box { font-size: 1.05rem; padding: 4px 10px; }
            .record-box { font-size: 0.95rem; padding: 4px 10px; }
            .weight-box { font-size: 0.85rem; padding: 4px 9px; }
            .owner-chip { font-size: 0.62rem; padding: 2px 7px; }
            .input-display { font-size: 1.4rem; letter-spacing: 5px; min-width: 120px; }
            .memo-badge { max-width: 100%; }
        }

        .score-box {
            background: #ffd966;
            color: #1e2a36;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #b38f40;
            white-space: nowrap;
        }

        .record-box {
            background: #4a627a;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #2a3a4a;
            white-space: nowrap;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .input-display {
            background: #2a3e52;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.8rem;
            letter-spacing: 8px;
            text-align: center;
            border: 2px solid #4a627a;
            color: #ffd966;
            font-weight: 600;
            min-width: 150px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #3a4c5e;
            padding: 6px 16px;
            border-radius: 40px;
            flex-wrap: wrap;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #e0e0e0;
        }

        .toggle-item input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: #95a5a6;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked {
            background: #2e7d32;
        }

        .toggle-item input[type="checkbox"]::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 0px;
            left: 0px;
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked::before {
            left: 16px;
        }

        .character-area {
            background: #eef3f7;
            border-radius: 60px;
            margin: 5px 0 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15);
            border: 3px solid white;
            position: relative;
            height: auto;
            min-height: 90px;
        }

        .korean-char {
            font-size: min(20vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            color: #1f3a4b;
            text-shadow: 3px 3px 0 #c9dae8;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: text;
            -webkit-user-select: text;
        }

        .combination-hint {
            font-size: 1rem;
            color: #4a627a;
            margin-top: 4px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .combination-hint.hidden {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
        }

        .play-button {
            position: absolute;
            bottom: -15px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffd966;
            border: 4px solid white;
            box-shadow: 0 4px 0 #b38f40, 0 8px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.05s linear;
            z-index: 10;
        }

        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b38f40, 0 8px 15px rgba(0,0,0,0.2);
        }

        .play-button span {
            transform: scale(1.2);
            display: inline-block;
        }

        .keyboard-container {
            background: #d9e2ec;
            border-radius: 30px;
            padding: 20px 12px 15px;
            margin: 5px 0 20px;
            border: 2px solid white;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .key {
            background: white;
            border-radius: 16px;
            padding: 6px 0;
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 4px 0 #b0bec5, 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #f0f4fa;
            flex: 0 1 auto;
            transition: all 0.05s ease;
            cursor: pointer;
        }

        .key.active {
            background: #f5e56b;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b0bec5;
        }

        .key .korean {
            display: block;
            font-size: 1.2rem;
            color: #0f2a3b;
        }

        .key .roman {
            display: block;
            font-size: 0.65rem;
            color: #5c6f82;
            font-weight: 400;
        }

        .key .eng {
            display: block;
            font-size: 0.65rem;
            color: #aa00aa;
            font-weight: 600;
            text-transform: uppercase;
        }

        .key.vowel .korean {
            color: #b13e3e;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 10px;
            gap: 10px;
        }

        .message {
            background: #273a4b;
            padding: 10px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            flex: 1;
            font-size: 0.95rem;
            border-left: 6px solid #ffd966;
            user-select: text;
            -webkit-user-select: text;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .footer-note {
            text-align: center;
            color: #6c8aa3;
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: 400;
            user-select: text;
            -webkit-user-select: text;
        }

        .loading {
            text-align: center;
            color: #ffd966;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-bar">
            <div class="sb-group">
                <a class="home-btn" href="/" title="Back to the app menu" aria-label="Back to the app menu">🏠</a>
                <div class="score-box" id="scoreDisplay">0</div>
                <div class="record-box" id="recordDisplay">#1</div>
                <div class="weight-box" id="weightDisplay" title="Weight — higher means this syllable comes up more often">⚖️ 12</div>
                <span class="owner-chip" id="ownerChip" title="Your data in D1 (memo + weights are per owner)">—</span>
            </div>
            <div class="input-display" id="inputDisplay">＿＿</div>
            <div class="memo-badge" id="memoBadge">
                <span>💭</span>
                <span class="memo-text empty" id="memoText">no memo</span>
                <button class="memo-edit" id="memoEdit" title="Edit memo for this syllable">✏️</button>
            </div>
            <div class="toggle-group">
                <div class="toggle-item">
                    <span>🔤 Hint</span>
                    <input type="checkbox" id="hintToggle" checked>
                </div>
                <div class="toggle-item">
                    <span>🔊 Sound</span>
                    <input type="checkbox" id="soundToggle" checked>
                </div>
            </div>
        </div>

        <div class="character-area">
            <div class="korean-char" id="currentChar">⋯</div>
            <div class="combination-hint" id="combinationHint">loading...</div>
            <div class="play-button" id="playButton" title="Pronounce this character">
                <span>🔊</span>
            </div>
        </div>

        <!-- Keyboard in QWERTY layout -->
        <div class="keyboard-container">
            <div class="key-row" id="row1"></div>
            <div class="key-row" id="row2"></div>
            <div class="key-row" id="row3"></div>
        </div>

        <div class="feedback-area">
            <div class="message" id="feedbackMsg">📂 Loading 505 characters...</div>
        </div>
        
        <div class="backdrop" id="mBackdrop">
            <div class="modal">
                <h2>Memo · <span id="mTitle">⋯</span></h2>
                <div class="sub">Stored in D1 for this syllable only · owner <span id="mOwner">—</span></div>
                <textarea id="mInput" maxlength="300" placeholder="e.g. hAn → 恨 (han = grudge)"></textarea>
                <div class="row">
                    <span id="mStatus"></span>
                    <button id="mCancel">Cancel</button>
                    <button id="mSave">Save</button>
                </div>
            </div>
        </div>

        <div class="footer-note">Dubeolsik · 505 音節（KRChars505.txt）· 加權出題 · Space 發音 · memo 與 weight 存 D1 · 每人一份</div>
    </div>

    <script>
        (function() {
            // ---------- QWERTY to Korean mapping (same as before) ----------
            const MAP = {
                'Q': { kr: 'ㅂ', rom: 'b' },
                'W': { kr: 'ㅈ', rom: 'j' },
                'E': { kr: 'ㄷ', rom: 'd' },
                'R': { kr: 'ㄱ', rom: 'g' },
                'T': { kr: 'ㅅ', rom: 's' },
                'Y': { kr: 'ㅛ', rom: 'yo' },
                'U': { kr: 'ㅕ', rom: 'yeo' },
                'I': { kr: 'ㅑ', rom: 'ya' },
                'O': { kr: 'ㅐ', rom: 'ae' },
                'P': { kr: 'ㅔ', rom: 'e' },
                'A': { kr: 'ㅁ', rom: 'm' },
                'S': { kr: 'ㄴ', rom: 'n' },
                'D': { kr: 'ㅇ', rom: 'ng' },
                'F': { kr: 'ㄹ', rom: 'r/l' },
                'G': { kr: 'ㅎ', rom: 'h' },
                'H': { kr: 'ㅗ', rom: 'o' },
                'J': { kr: 'ㅓ', rom: 'eo' },
                'K': { kr: 'ㅏ', rom: 'a' },
                'L': { kr: 'ㅣ', rom: 'i' },
                'Z': { kr: 'ㅋ', rom: 'k' },
                'X': { kr: 'ㅌ', rom: 't' },
                'C': { kr: 'ㅊ', rom: 'ch' },
                'V': { kr: 'ㅍ', rom: 'p' },
                'B': { kr: 'ㅠ', rom: 'yu' },
                'N': { kr: 'ㅜ', rom: 'u' },
                'M': { kr: 'ㅡ', rom: 'eu' }
            };

            // Vowels set for color coding
            const VOWELS = new Set(['Y','U','I','O','P','H','J','K','L','B','N','M']);

            // ---------- Memo hints from KRCMemo.txt (embedded) ----------
            const MEMO_MAP = {
                'q': 'ㅂ boutique',
                'w': 'ㅈ JaW',
                'e': 'ㄷ DEad',
                'r': 'ㄱ Grrrr',
                't': 'ㅅ Sit',
                'a': 'ㅁ MamA',
                's': 'ㄴ North South',
                'd': 'ㅇ O D Overdose',
                'f': 'ㄹ two leaf',
                'g': 'ㅎ Hug',
                'z': 'ㅋ Kizz',
                'x': 'ㅌ Tax',
                'c': 'ㅊ Chill',
                'v': 'ㅍ Pave',
                'y': 'ㅛ YO-yo',
                'u': 'ㅕ yo You',
                'i': 'ㅑ Ya I',
                'o': 'ㅐ Aero Ho Ho Ho',
                'p': 'ㅔ ape',
                'h': 'ㅗ Oh Oh OH',
                'j': 'ㅓ urge; jean',
                'k': 'ㅏ Ark',
                'l': 'ㅣ Ill',
                'b': 'ㅠ Youtube',
                'n': 'ㅜ tun',
                'm': 'ㅡ umm',
                'R': 'ㄲ kk',
                'E': 'ㄸ tt DEad GEt',
                'Q': 'ㅃ pp boutique PaQ',
                'T': 'ㅆ ss Sit',
                'W': 'ㅉ jj Jaw',
                'O': 'ㅒ yae Yellow',
                'P': 'ㅖ ye yape'
            };

            // ---------- D1：owner / weight / memo ----------
            // 505 個音節的 weight 與 memo 存在 Cloudflare D1（表 syl_stats / syl_memos），
            // 每人一份；?owner=xxx 可切換，沒帶就是 fred0928。
            const API_BASE = 'https://krmemo.fred0928.workers.dev';
            const DEFAULT_OWNER = 'fred0928';
            const WEIGHT_START = 12;
            const OWNER = (() => {
                try {
                    const qs = new URLSearchParams(location.search).get('owner');
                    if (qs && /^[A-Za-z0-9._-]{1,40}$/.test(qs)) { localStorage.setItem('kr_owner', qs); return qs; }
                    const saved = localStorage.getItem('kr_owner');
                    if (saved && /^[A-Za-z0-9._-]{1,40}$/.test(saved)) return saved;
                    localStorage.setItem('kr_owner', DEFAULT_OWNER);
                    return DEFAULT_OWNER;
                } catch (e) { return DEFAULT_OWNER; }
            })();

            let SYL_ITEMS = {};        // syl -> { memo, weight, correct, wrong, updated }
            let lastIndex = -1;        // 連續同題防護

            const weightOf = (syl) => {
                const it = SYL_ITEMS[syl];
                return it && Number.isFinite(it.weight) ? it.weight : WEIGHT_START;
            };
            const memoOf = (syl) => (SYL_ITEMS[syl] && SYL_ITEMS[syl].memo) || '';

            async function loadD1() {
                try {
                    const r = await fetch(`${API_BASE}/api/syl?owner=${encodeURIComponent(OWNER)}`, { cache: 'no-store' });
                    const d = await r.json();
                    SYL_ITEMS = (d && d.items) || {};
                } catch (e) {
                    console.warn('D1 unavailable — weights fall back to 12', e);
                    SYL_ITEMS = {};
                }
            }

            async function reportResult(syl, result) {
                try {
                    const r = await fetch(`${API_BASE}/api/syl/review`, {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ owner: OWNER, syl, result })
                    });
                    const d = await r.json();
                    if (d && d.ok) {
                        SYL_ITEMS[syl] = Object.assign({}, SYL_ITEMS[syl] || {},
                            { weight: d.weight, correct: d.correct, wrong: d.wrong });
                        if (currentQuiz && currentQuiz.char === syl) paintMeta();
                    }
                } catch (e) {
                    console.warn('review not saved', e);
                }
            }

            async function saveMemo(syl, memo) {
                const r = await fetch(`${API_BASE}/api/syl/memo`, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ owner: OWNER, syl, memo })
                });
                const d = await r.json();
                if (!d || !d.ok) throw new Error((d && d.error) || 'save failed');
                SYL_ITEMS[syl] = Object.assign({}, SYL_ITEMS[syl] || {}, { memo: d.memo, updated: d.updated });
            }

            // ---------- State ----------
            let QUIZ_LIST = [];                // will be loaded from file
            let currentQuiz = null;
            let userInput = '';
            let score = 0;
            let hintEnabled = true;
            let soundEnabled = true;
            let canType = false;                // start false until data loaded
            let totalChars = 0;
            
            // 儲存最後的錯誤訊息，避免被清除
            let lastErrorMsg = '';

            // DOM elements
            const currentCharEl = document.getElementById('currentChar');
            const combinationHintEl = document.getElementById('combinationHint');
            const inputDisplayEl = document.getElementById('inputDisplay');
            const feedbackMsgEl = document.getElementById('feedbackMsg');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const weightDisplay = document.getElementById('weightDisplay');
            const memoTextEl = document.getElementById('memoText');
            const memoBadge = document.getElementById('memoBadge');
            const memoEdit = document.getElementById('memoEdit');
            const mBackdrop = document.getElementById('mBackdrop');
            const mTitle = document.getElementById('mTitle');
            const mOwner = document.getElementById('mOwner');
            const mInput = document.getElementById('mInput');
            const mStatus = document.getElementById('mStatus');
            const recordDisplay = document.getElementById('recordDisplay');
            const hintToggle = document.getElementById('hintToggle');
            const soundToggle = document.getElementById('soundToggle');
            const playButton = document.getElementById('playButton');
            const row1 = document.getElementById('row1');
            const row2 = document.getElementById('row2');
            const row3 = document.getElementById('row3');

            // ---------- Helper: shuffle array (Fisher-Yates algorithm) ----------
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // ---------- Helper: get random quiz index ----------
            function getRandomQuizIndex() {
                const n = QUIZ_LIST.length;
                if (!n) return 0;
                const ws = new Array(n);
                let total = 0;
                for (let i = 0; i < n; i++) {
                    ws[i] = i === lastIndex ? 0 : Math.max(1, weightOf(QUIZ_LIST[i].char));
                    total += ws[i];
                }
                if (total <= 0) return Math.floor(Math.random() * n);
                let r = Math.random() * total;
                for (let i = 0; i < n; i++) {
                    if (ws[i] <= 0) continue;
                    r -= ws[i];
                    if (r <= 0) { lastIndex = i; return i; }
                }
                lastIndex = n - 1;
                return n - 1;
            }

            // ---------- Helper: speak text ----------
            function speakText(text, lang = 'ko-KR') {
                if (!soundEnabled) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }

            // ---------- Render keyboard ----------
            function renderKeyboard() {
                const row1Keys = ['Q','W','E','R','T','Y','U','I','O','P'];
                const row2Keys = ['A','S','D','F','G','H','J','K','L'];
                const row3Keys = ['Z','X','C','V','B','N','M'];

                row1.innerHTML = '';
                row2.innerHTML = '';
                row3.innerHTML = '';

                row1Keys.forEach(letter => buildKey(letter, row1));
                row2Keys.forEach(letter => buildKey(letter, row2));
                row3Keys.forEach(letter => buildKey(letter, row3));
            }

            function buildKey(letter, parentRow) {
                const item = MAP[letter];
                if (!item) return;
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key';
                if (VOWELS.has(letter)) keyDiv.classList.add('vowel');
                keyDiv.dataset.letter = letter;
                keyDiv.innerHTML = `
                    <span class="korean">${item.kr}</span>
                    <span class="roman">${item.rom}</span>
                    <span class="eng">${letter}</span>
                `;
                
                keyDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    speakText(item.kr);
                });
                
                parentRow.appendChild(keyDiv);
            }

            // ---------- 根據組合長度生成底線 ----------
            function getUnderlineString(comboLength) {
                return '＿'.repeat(comboLength);  // 使用全形底線更明顯
            }

            // ---------- Update input display with dynamic underlines ----------
            function updateInputDisplay() {
                if (!currentQuiz) {
                    inputDisplayEl.innerText = '＿＿';
                    return;
                }
                
                const comboLength = currentQuiz.combo.length;
                
                if (userInput === '') {
                    inputDisplayEl.innerText = getUnderlineString(comboLength);
                } else {
                    // 顯示已輸入的字符，後面補上剩餘數量的底線
                    const remainingCount = comboLength - userInput.length;
                    const remainingUnderlines = remainingCount > 0 ? '＿'.repeat(remainingCount) : '';
                    inputDisplayEl.innerText = userInput + remainingUnderlines;
                }
            }

            // ---------- 更新提示顯示狀態 ----------
            function updateHintVisibility() {
                if (!currentQuiz) return;
                
                if (hintEnabled) {
                    combinationHintEl.innerText = `${currentQuiz.combo} · ${currentQuiz.roma}`;
                    combinationHintEl.classList.remove('hidden');
                } else {
                    combinationHintEl.classList.add('hidden');
                }
            }

            // ---------- Build hint string from correct answer (for error messages) ----------
            function buildCorrectHint() {
                if (!hintEnabled || !currentQuiz) return '';
                const correctCombo = currentQuiz.combo;
                let hintParts = [];
                for (let ch of correctCombo) {
                    const lower = ch.toLowerCase();
                    const memo = MEMO_MAP[lower];
                    if (memo) {
                        hintParts.push(`[${lower}: ${memo}]`);
                    } else {
                        hintParts.push(`[${lower}: ?]`);
                    }
                }
                return hintParts.join(' ');
            }

            // ---------- Load quiz data from KRChars505.txt ----------
            async function loadQuizData() {
                try {
                    const response = await fetch('KRChars505.txt');
                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }
                    const text = await response.text();
                    parseQuizData(text);
                } catch (error) {
                    console.error('Failed to load KRChars505.txt:', error);
                    feedbackMsgEl.innerText = '❌ Failed to load KRChars505.txt. Using fallback data.';
                    // Fallback to first 20 entries from original list
                    useFallbackData();
                }
            }

            function parseQuizData(text) {
                const lines = text.split('\n');
                QUIZ_LIST = [];
                
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith('#')) continue; // skip empty lines and header
                    
                    const parts = line.split('\t');
                    if (parts.length >= 4) {
                        // Format: # Korean Dubeolsik RR
                        const recordNo = parseInt(parts[0]);  // Get the record number
                        const korean = parts[1].trim();
                        const combo = parts[2].trim();
                        const roma = parts[3].trim();
                        
                        if (korean && combo && roma) {
                            QUIZ_LIST.push({ 
                                char: korean, 
                                combo: combo, 
                                roma: roma,
                                recordNo: recordNo  // Store record number
                            });
                        }
                    }
                }
                
                if (QUIZ_LIST.length === 0) {
                    throw new Error('No valid entries found');
                }
                
                totalChars = QUIZ_LIST.length;
                feedbackMsgEl.innerText = `✅ Loaded ${totalChars} characters. Start typing!`;
                
                // Shuffle the quiz list for random order
                QUIZ_LIST = shuffleArray(QUIZ_LIST);
                
                // Enable typing and load first quiz
                canType = true;
                loadQuiz();
            }

            function useFallbackData() {
                // Fallback to first 20 entries from original list with record numbers
                QUIZ_LIST = [
                    { char: '은', combo: 'dms', roma: 'eun', recordNo: 1 },
                    { char: '는', combo: 'sms', roma: 'neun', recordNo: 2 },
                    { char: '이', combo: 'dl', roma: 'i', recordNo: 3 },
                    { char: '도', combo: 'eh', roma: 'do', recordNo: 4 },
                    { char: '일', combo: 'dlf', roma: 'il', recordNo: 5 },
                    { char: '수', combo: 'tn', roma: 'su', recordNo: 6 },
                    { char: '지', combo: 'wl', roma: 'ji', recordNo: 7 },
                    { char: '한', combo: 'gks', roma: 'han', recordNo: 8 },
                    { char: '로', combo: 'fh', roma: 'ro', recordNo: 9 },
                    { char: '그', combo: 'rm', roma: 'geu', recordNo: 10 },
                    { char: '를', combo: 'fmf', roma: 'reul', recordNo: 11 },
                    { char: '대', combo: 'eo', roma: 'dae', recordNo: 12 },
                    { char: '사', combo: 'tk', roma: 'sa', recordNo: 13 },
                    { char: '인', combo: 'dls', roma: 'in', recordNo: 14 },
                    { char: '년', combo: 'sus', roma: 'nyeon', recordNo: 15 },
                    { char: '월', combo: 'dnjf', roma: 'wol', recordNo: 16 },
                    { char: '세', combo: 'tp', roma: 'se', recordNo: 17 },
                    { char: '시', combo: 'tl', roma: 'si', recordNo: 18 },
                    { char: '분', combo: 'qns', roma: 'bun', recordNo: 19 },
                    { char: '의', combo: 'dml', roma: 'ui', recordNo: 20 }
                ];
                
                // Shuffle the fallback data too
                QUIZ_LIST = shuffleArray(QUIZ_LIST);
                
                totalChars = QUIZ_LIST.length;
                feedbackMsgEl.innerText = `✅ Loaded ${totalChars} characters (fallback). Start typing!`;
                canType = true;
                loadQuiz();
            }

            // ---------- 當前題目的 weight 與 memo ----------
            function paintMeta() {
                if (!currentQuiz) return;
                weightDisplay.innerText = '⚖️ ' + weightOf(currentQuiz.char);
                const memo = memoOf(currentQuiz.char);
                memoTextEl.innerText = memo || 'no memo';
                memoTextEl.classList.toggle('empty', !memo);
                memoTextEl.title = memo;
            }

            function openMemoModal() {
                if (!currentQuiz) return;
                mTitle.innerText = currentQuiz.char;
                mOwner.innerText = OWNER;
                mInput.value = memoOf(currentQuiz.char);
                mStatus.innerText = '';
                mBackdrop.classList.add('open');
                setTimeout(() => mInput.focus(), 30);
            }

            function closeMemoModal() {
                mBackdrop.classList.remove('open');
            }

            async function submitMemo() {
                if (!currentQuiz) return;
                const syl = currentQuiz.char;
                mStatus.innerText = 'Saving…';
                try {
                    await saveMemo(syl, mInput.value.trim());
                    mStatus.innerText = 'Saved ✓';
                    paintMeta();
                    setTimeout(closeMemoModal, 450);
                } catch (e) {
                    mStatus.innerText = '❌ ' + e.message;
                }
            }

            // ---------- Update UI with current quiz ----------
            function loadQuiz() {
                // Select a random quiz from the list
                const randomIndex = getRandomQuizIndex();
                currentQuiz = QUIZ_LIST[randomIndex];
                
                currentCharEl.innerText = currentQuiz.char;
                
                // Update record display
                recordDisplay.innerText = `#${currentQuiz.recordNo}`;
                
                // 根據 hintEnabled 狀態更新提示顯示
                if (hintEnabled) {
                    combinationHintEl.innerText = `${currentQuiz.combo} · ${currentQuiz.roma}`;
                    combinationHintEl.classList.remove('hidden');
                } else {
                    combinationHintEl.classList.add('hidden');
                }
                
                userInput = '';
                updateInputDisplay();
                paintMeta();

                // Auto-speak if sound on
                if (soundEnabled) {
                    speakText(currentQuiz.char);
                }

                // Remove active highlights from keys
                document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
                
                // 清除最後的錯誤訊息，但不影響 feedbackMsg（如果是正確情況）
                lastErrorMsg = '';
            }

            // ---------- Clear input manually (保留提示訊息) ----------
            function clearInput() {
                userInput = '';
                updateInputDisplay();
                // 不清除 feedbackMsg，保留最後的提示
            }

            // ---------- Handle keystroke ----------
            function onKeyDown(e) {
                if (!canType || !currentQuiz) return;

                const key = e.key;
                if (!/^[a-zA-Z]$/.test(key)) return;
                e.preventDefault();

                const lowerKey = key.toLowerCase();

                // Add to user input
                userInput += lowerKey;
                updateInputDisplay();

                const correctCombo = currentQuiz.combo;

                // If userInput length exceeds correct combo length -> definitely wrong
                if (userInput.length > correctCombo.length) {
                    const correctHint = buildCorrectHint();
                    if (hintEnabled && correctHint) {
                        lastErrorMsg = `❌ 錯誤！正確組合是：${correctCombo} ${correctHint}`;
                    } else {
                        lastErrorMsg = `❌ 錯誤！正確組合是：${correctCombo}`;
                    }
                    feedbackMsgEl.innerText = lastErrorMsg;
                    feedbackMsgEl.style.background = '#9e2d2d';
                    reportResult(currentQuiz.char, 'wrong');

                    canType = false;
                    setTimeout(() => {
                        clearInput();  // 清除輸入欄，但保留提示訊息
                        canType = true;
                    }, 1500);
                    return;
                }

                // Check if userInput matches the prefix of correct combo
                for (let i = 0; i < userInput.length; i++) {
                    // 資料檔用大寫表示 Shift（ㅃㅉㄸㄲㅆ…），這裡不分大小寫比對，
                    // 否則 85 個雙子音音節永遠打不出來（手機也沒有 Shift 可按）
                    if (userInput[i].toLowerCase() !== correctCombo[i].toLowerCase()) {
                        const correctHint = buildCorrectHint();
                        if (hintEnabled && correctHint) {
                            lastErrorMsg = `❌ 錯誤！正確組合是：${correctCombo} ${correctHint}`;
                        } else {
                            lastErrorMsg = `❌ 錯誤！正確組合是：${correctCombo}`;
                        }
                        feedbackMsgEl.innerText = lastErrorMsg;
                        feedbackMsgEl.style.background = '#9e2d2d';
                        reportResult(currentQuiz.char, 'wrong');

                        canType = false;
                        setTimeout(() => {
                            clearInput();  // 清除輸入欄，但保留提示訊息
                            canType = true;
                        }, 1500);
                        return;
                    }
                }

                // If full match -> correct!
                if (userInput.toLowerCase() === correctCombo.toLowerCase()) {
                    score += 1;
                    scoreDisplay.innerText = score;
                    reportResult(currentQuiz.char, 'correct');
                    feedbackMsgEl.innerText = '✅ 正確！ +1';
                    feedbackMsgEl.style.background = '#1f5f3a';

                    if (soundEnabled) {
                        speakText(currentQuiz.char);
                    }

                    canType = false;

                    // Move to next random quiz after short delay
                    setTimeout(() => {
                        loadQuiz();  // This will now pick a random quiz
                        feedbackMsgEl.innerText = '⌨️ 請輸入組合...';
                        feedbackMsgEl.style.background = '#273a4b';
                        canType = true;
                    }, 800);
                } else {
                    // Partial match
                    feedbackMsgEl.innerText = `⌨️ 繼續... (${userInput.length}/${correctCombo.length})`;
                    feedbackMsgEl.style.background = '#273a4b';
                }
            }

            // ---------- Event listeners ----------
            window.addEventListener('keydown', onKeyDown);

            // Space = 念目前這個音節（編輯視窗開著時不攔）
            window.addEventListener('keydown', (e) => {
                if (e.code !== 'Space' && e.key !== ' ') return;
                if (mBackdrop.classList.contains('open')) return;
                e.preventDefault();
                if (currentQuiz) speakText(currentQuiz.char);
            });

            memoEdit.addEventListener('click', openMemoModal);
            memoBadge.addEventListener('click', (e) => {
                if (e.target.closest('.memo-edit')) return;
                openMemoModal();
            });
            document.getElementById('mSave').addEventListener('click', submitMemo);
            document.getElementById('mCancel').addEventListener('click', closeMemoModal);
            mBackdrop.addEventListener('click', (e) => { if (e.target === mBackdrop) closeMemoModal(); });
            mInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitMemo(); }
                if (e.key === 'Escape') { e.preventDefault(); closeMemoModal(); }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && mBackdrop.classList.contains('open')) closeMemoModal();
            });

            hintToggle.addEventListener('change', (e) => {
                hintEnabled = e.target.checked;
                updateHintVisibility();
            });

            soundToggle.addEventListener('change', (e) => {
                soundEnabled = e.target.checked;
            });

            playButton.addEventListener('click', () => {
                if (currentQuiz) {
                    speakText(currentQuiz.char);
                }
            });

            // Virtual keyboard clicks
            function setupKeyClickListeners() {
                document.querySelectorAll('.key').forEach(key => {
                    key.addEventListener('click', (e) => {
                        const letter = key.dataset.letter;
                        if (letter && canType && currentQuiz) {
                            const fakeEvent = { key: letter, preventDefault: () => {} };
                            onKeyDown(fakeEvent);
                        }
                    });
                });
            }

            // ---------- Initialize ----------
            async function init() {
                const chip = document.getElementById('ownerChip');
                if (chip) chip.textContent = OWNER;

                renderKeyboard();
                // Wait a tick for keyboard to render, then attach click listeners
                setTimeout(setupKeyClickListeners, 100);
                
                // 先拿 D1 的 weight／memo，再抽第一題（失敗也照樣開始，全部當 12）
                await loadD1();

                // Load quiz data from file
                await loadQuizData();
                
                // Initialize score display
                scoreDisplay.innerText = '0';
                hintEnabled = true;
                soundEnabled = true;
                hintToggle.checked = true;
                soundToggle.checked = true;
            }

            init();
        })();
    </script>
</body>
</html>
