<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Korean Typing Practice · Dubeolsik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #16232f 0%, #0b131a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #1a2732;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 24px 20px 30px;
            border: 1px solid rgba(255,255,255,0.07);
        }

        .page-title {
            margin: 0 0 14px;
            text-align: center;
            font-size: clamp(1.02rem, 4.3vw, 1.4rem);
            font-weight: 800;
            letter-spacing: .2px;
            color: #e8f1f8;
            line-height: 1.3;
            text-wrap: balance;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121d26;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            color: #e8f1f8;
            font-weight: 600;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            gap: 8px;
            flex-wrap: wrap;
        }

        .weight-box {
            background: #24374a;
            color: #cfe4f5;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: .5px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #24374a;
            color: #eaf3fb;
            font-size: 1.15rem;
            line-height: 1;
            text-decoration: none;
            box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
            flex: 0 0 auto;
            transition: transform .12s ease, background .12s ease;
        }
        .home-btn:hover { background: #2f465d; transform: translateY(-1px); }
        .home-btn:active { transform: translateY(0); }

        .score-box {
            background: #ffd966;
            color: #121d26;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #a8842f;
            white-space: nowrap;
        }

        .memo-badge {
            background: #2a3d4f;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .memo-badge span {
            color: #ffd966;
            font-weight: 500;
        }

        .memo-badge .memo-text {
            color: #e6f0f8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1f3243;
            padding: 6px 16px;
            border-radius: 40px;
            flex-wrap: wrap;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #c3d5e4;
        }

        .toggle-item input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: #44586b;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, .35);
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked {
            background: #2e7d32;
        }

        .toggle-item input[type="checkbox"]::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #eef5fb;
            border-radius: 50%;
            top: 0px;
            left: 0px;
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked::before {
            left: 16px;
        }

        .character-area {
            background: #0f1a24;
            border-radius: 60px;
            margin: 5px 0 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.45), 0 10px 24px rgba(0,0,0,0.35);
            border: 3px solid #24374a;
            position: relative;
            height: auto;
            min-height: 90px;
        }

        .korean-char {
            font-size: min(20vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            color: #f2f8fd;
            text-shadow: 0 4px 0 rgba(0, 0, 0, .45);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-hint {
            font-size: 1rem;
            color: #9db4c7;
            margin-top: 4px;
            font-weight: 500;
            transition: opacity 0.2s;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-hint.hidden {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
        }

        /* Play button for manual sound */
        .play-button {
            position: absolute;
            bottom: -15px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffd966;
            border: 4px solid #16232f;
            box-shadow: 0 4px 0 #a8842f, 0 8px 16px rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.05s linear;
            z-index: 10;
        }

        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a8842f, 0 8px 16px rgba(0,0,0,0.45);
        }

        .play-button span {
            transform: scale(1.2);
            display: inline-block;
        }

        .keyboard-container {
            background: #131f29;
            border-radius: 30px;
            padding: 20px 12px 15px;
            margin: 5px 0 20px;
            border: 2px solid #223444;
        }

        /* QWERTY layout rows */
        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .key {
            background: #253748;
            border-radius: 16px;
            padding: 6px 0;
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 4px 0 #0c151d, 0 2px 8px rgba(0,0,0,0.3);
            border: 1px solid #2e4256;
            flex: 0 1 auto;
            transition: all 0.05s ease;
            cursor: pointer;
        }

        .key.active {
            background: #ffd966;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a8842f;
        }
        .key.active .korean { color: #121d26; }
        .key.active .roman { color: #3f4f5e; }
        .key.active .eng { color: #6b3fa0; }

        .key .korean {
            display: block;
            font-size: 1.2rem;
            color: #eaf3fb;
        }

        .key .roman {
            display: block;
            font-size: 0.65rem;
            color: #a6bacb;
            font-weight: 400;
        }

        .key .eng {
            display: block;
            font-size: 0.65rem;
            color: #cf9bff;
            font-weight: 600;
            text-transform: uppercase;
        }

        .key.vowel .korean {
            color: #f7a1a1;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 10px;
            gap: 10px;
        }

        .message {
            background: #1c2c3b;
            padding: 10px 18px;
            border-radius: 40px;
            color: #e8f1f8;
            font-weight: 500;
            flex: 1;
            font-size: 0.95rem;
            border-left: 6px solid #ffd966;
            user-select: text;
            -webkit-user-select: text;
        }

        /* ✏️ memo 編輯 */
        .memo-edit {
            margin-left: 8px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            background: transparent;
            color: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            line-height: 1;
        }
        .memo-edit:hover { background: rgba(255, 255, 255, .12); }

        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .55);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; z-index: 100;
        }
        .modal-backdrop[hidden] { display: none; }
        .modal {
            width: 100%; max-width: 420px;
            background: #1e2b38;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
        }
        .modal h3 {
            margin: 0 0 4px;
            font-size: 1.05rem;
            color: #dbe9f5;
        }
        .modal .modal-sub {
            margin: 0 0 12px;
            font-size: 0.78rem;
            color: #8fa9bf;
        }
        .modal textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 96px;
            resize: vertical;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .18);
            background: #16212b;
            color: #eaf3fb;
            font-size: 1rem;
            font-family: inherit;
        }
        .modal textarea:focus { outline: 2px solid #4a9fd4; outline-offset: 1px; }
        .modal-btns {
            display: flex; justify-content: flex-end; gap: 10px;
            margin-top: 14px;
        }
        .modal-btns button {
            padding: 9px 16px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, .2);
            background: transparent;
            color: #dbe9f5;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .modal-btns button.primary {
            background: #2f7fb5;
            border-color: #2f7fb5;
            color: #fff;
            font-weight: 600;
        }
        .modal-btns button:disabled { opacity: .55; cursor: default; }
        .modal-status {
            margin-top: 10px;
            min-height: 1.1em;
            font-size: 0.82rem;
            color: #8fa9bf;
        }
        .modal-status.err { color: #ff9b9b; }

        .footer-note {
            text-align: center;
            color: #7b93a8;
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: 400;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Korean Input Dubeolsik (2-set)</h1>
        <div class="stats-bar">
            <a class="home-btn" href="/" title="Back to the app menu" aria-label="Back to the app menu">🏠</a>
            <div class="score-box" id="scoreDisplay">0</div>
            <div class="weight-box" id="weightDisplay" title="Weight — higher means this letter comes up more often">⚖️ 12</div>
            
            <div class="memo-badge" id="memoBadge">
                <span>💭</span>
                <span class="memo-text" id="memoText"></span>
                <button class="memo-edit" id="memoEdit" title="Edit memo for this letter">✏️</button>
            </div>

            <div class="toggle-group">
                <div class="toggle-item">
                    <span>🔤 Hint</span>
                    <input type="checkbox" id="hintToggle" checked>
                </div>
                <div class="toggle-item">
                    <span>🔊 Auto</span>
                    <input type="checkbox" id="autoPlayToggle" checked>
                </div>
            </div>
        </div>

        <div class="character-area">
            <div class="korean-char" id="currentChar">ㅏ</div>
            <div class="input-hint" id="hintText">a · press "K"</div>
            <!-- Manual play button -->
            <div class="play-button" id="playButton" title="Pronounce this letter (Space)">
                <span>🔊</span>
            </div>
        </div>

        <!-- Keyboard in QWERTY layout -->
        <div class="keyboard-container">
            <!-- Row 1: Q W E R T Y U I O P -->
            <div class="key-row" id="row1"></div>
            <!-- Row 2: A S D F G H J K L -->
            <div class="key-row" id="row2"></div>
            <!-- Row 3: Z X C V B N M -->
            <div class="key-row" id="row3"></div>
        </div>

        <div class="feedback-area">
            <div class="message" id="feedbackMsg">⌨️ Type the letter...</div>
        </div>
        
        <div class="footer-note">Dubeolsik · press keys QWERTY · Auto-advances when correct · Memo appears only on error</div>
    </div>

    <div class="modal-backdrop" id="memoModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memoTitle">
            <h3 id="memoTitle">💭 Memo · <span id="memoJamo">ㅂ</span></h3>
            <p class="modal-sub">Saved to the cloud (D1) — shows up on every device.</p>
            <textarea id="memoInput" placeholder="e.g. boutique" spellcheck="false"></textarea>
            <div class="modal-btns">
                <button id="memoCancel">Cancel</button>
                <button id="memoSave" class="primary">Save</button>
            </div>
            <div class="modal-status" id="memoStatus"></div>
        </div>
    </div>

    <script>
        (function() {
            // Mapping: English letter -> Korean + romanization
            const MAP = {
                // Row 1
                'Q': { kr: 'ㅂ', rom: 'b' },
                'W': { kr: 'ㅈ', rom: 'j' },
                'E': { kr: 'ㄷ', rom: 'd' },
                'R': { kr: 'ㄱ', rom: 'g' },
                'T': { kr: 'ㅅ', rom: 's' },
                'Y': { kr: 'ㅛ', rom: 'yo' },
                'U': { kr: 'ㅕ', rom: 'yeo' },
                'I': { kr: 'ㅑ', rom: 'ya' },
                'O': { kr: 'ㅐ', rom: 'ae' },
                'P': { kr: 'ㅔ', rom: 'e' },
                // Row 2
                'A': { kr: 'ㅁ', rom: 'm' },
                'S': { kr: 'ㄴ', rom: 'n' },
                'D': { kr: 'ㅇ', rom: 'ng' },
                'F': { kr: 'ㄹ', rom: 'r/l' },
                'G': { kr: 'ㅎ', rom: 'h' },
                'H': { kr: 'ㅗ', rom: 'o' },
                'J': { kr: 'ㅓ', rom: 'eo' },
                'K': { kr: 'ㅏ', rom: 'a' },
                'L': { kr: 'ㅣ', rom: 'i' },
                // Row 3
                'Z': { kr: 'ㅋ', rom: 'k' },
                'X': { kr: 'ㅌ', rom: 't' },
                'C': { kr: 'ㅊ', rom: 'ch' },
                'V': { kr: 'ㅍ', rom: 'p' },
                'B': { kr: 'ㅠ', rom: 'yu' },
                'N': { kr: 'ㅜ', rom: 'u' },
                'M': { kr: 'ㅡ', rom: 'eu' }
            };

            // All keys in QWERTY order for random selection
            const ALL_KEYS = [
                'Q','W','E','R','T','Y','U','I','O','P',
                'A','S','D','F','G','H','J','K','L',
                'Z','X','C','V','B','N','M'
            ];

            // Vowels set for color coding
            const VOWELS = new Set(['Y','U','I','O','P','H','J','K','L','B','N','M']);

            // State
            let currentEngKey = 'K';    // default: ㅏ
            let previousEngKey = null;   // Track previous key to avoid repetition
            const weights = {};          // 韓文字母 -> weight（與 ESFlash 同規則：錯 +3、對 -1、夾 1–15、起始 12）
            const WEIGHT_MIN = 1, WEIGHT_MAX = 15, WEIGHT_START = 12;
            let score = 0;
            let hintVisible = true;
            let autoPlayEnabled = true;
            let canAnswer = true;
            
            // Memo storage: maps Korean character to your custom sentence
            let memoMap = {};

            // DOM elements
            const currentCharEl = document.getElementById('currentChar');
            const hintTextEl = document.getElementById('hintText');
            const feedbackMsgEl = document.getElementById('feedbackMsg');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const hintToggle = document.getElementById('hintToggle');
            const autoPlayToggle = document.getElementById('autoPlayToggle');
            const playButton = document.getElementById('playButton');
            const weightDisplayEl = document.getElementById('weightDisplay');
            const memoTextEl = document.getElementById('memoText');
            const memoBadge = document.getElementById('memoBadge');
            const row1 = document.getElementById('row1');
            const row2 = document.getElementById('row2');
            const row3 = document.getElementById('row3');

            // ---------- Load KRMemo.txt file with fallbacks (Solution 1) ----------
            async function loadMemoFile() {
                // Try multiple possible paths
                const possiblePaths = [
                    'KRMemo.txt',        // Same folder (local, GitHub)
                    './KRMemo.txt',       // Explicit relative path
                    '/KRMemo.txt'         // Root path (for some servers)
                ];
                
                for (const path of possiblePaths) {
                    try {
                        console.log('Trying path:', path);
                        const response = await fetch(path);
                        if (response.ok) {
                            const text = await response.text();
                            parseMemoText(text);
                            console.log('Successfully loaded from:', path);
                            return;
                        }
                    } catch (e) {
                        console.log('Failed with path:', path);
                    }
                }
                
                // If all fails, use embedded fallback data
                console.log('Using embedded fallback memos');
                useFallbackMemos();
            }

            function parseMemoText(text) {
                // 檔案格式：`q: ㅂ boutique`（左邊是英文字母、右邊是韓文字母＋記憶法）
                // 一律換成「韓文字母」當 key，否則查詢時 memoMap['ㅂ'] 永遠找不到。
                text.split('\n').forEach(raw => {
                    const line = raw.trim();
                    if (!line || !line.includes(':')) return;
                    const idx = line.indexOf(':');
                    const left = line.slice(0, idx).trim().toUpperCase();
                    const right = line.slice(idx + 1).trim();
                    const m = right.match(/^([\u3131-\u318E])\s*(.*)$/);
                    if (m) {
                        memoMap[m[1]] = m[2].trim();          // 右邊自帶韓文字母
                    } else if (MAP[left]) {
                        memoMap[MAP[left].kr] = right;         // 只有 `q: boutique`
                    }
                });
            }

            // Cloudflare Worker + D1：雲端版本優先於檔案內容
            const MEMO_API = 'https://krmemo.fred0928.workers.dev';

            async function loadRemoteMemos() {
                try {
                    const res = await fetch(MEMO_API + '/api/memos', { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const remote = data.memos || {};
                    Object.keys(remote).forEach(jamo => {
                        const v = remote[jamo];
                        if (v && typeof v.memo === 'string') memoMap[jamo] = v.memo;
                        if (v && typeof v.weight === 'number') weights[jamo] = v.weight;
                    });
                    paintWeight();
                    console.log('remote memos merged:', Object.keys(remote).length);
                } catch (e) {
                    console.warn('memo API unavailable, using local KRMemo.txt', e);
                }
            }

            function weightOf(jamo) {
                const w = weights[jamo];
                return Number.isFinite(w) ? w : WEIGHT_START;
            }

            function paintWeight() {
                if (!weightDisplayEl || !MAP[currentEngKey]) return;
                weightDisplayEl.innerText = '⚖️ ' + weightOf(MAP[currentEngKey].kr);
            }

            // 答題結果寫回 D1；失敗只警告，不影響練習（weight 留在記憶體）
            function reportResult(result) {
                const jamo = MAP[currentEngKey].kr;
                const delta = result === 'wrong' ? 3 : -1;
                weights[jamo] = Math.min(WEIGHT_MAX, Math.max(WEIGHT_MIN, weightOf(jamo) + delta));
                paintWeight();
                fetch(MEMO_API + '/api/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jamo: jamo, result: result })
                }).then(r => r.ok ? r.json() : null).then(d => {
                    if (d && typeof d.weight === 'number') {
                        weights[jamo] = d.weight;
                        paintWeight();
                    }
                }).catch(e => console.warn('review not saved (offline?)', e));
            }

            async function saveRemoteMemo(jamo, memo) {
                const res = await fetch(MEMO_API + '/api/memo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jamo: jamo, memo: memo })
                });
                if (!res.ok) {
                    let msg = 'HTTP ' + res.status;
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                return res.json();
            }

            function useFallbackMemos() {
                // Your memos embedded directly in the code
                const fallbackMemos = {
                    'ㅂ': 'boutique',
                    'ㅈ': 'JaW',
                    'ㄷ': 'DEad',
                    'ㄱ': 'Grrrr',
                    'ㅅ': 'Sit',
                    'ㅁ': 'MamA',
                    'ㄴ': 'NoSe; NewS',
                    'ㅇ': 'no gooD O.D.',
                    'ㄹ': 'two leaf',
                    'ㅎ': 'Hug',
                    'ㅋ': 'Kizz',
                    'ㅌ': 'Tax',
                    'ㅊ': 'Chill',
                    'ㅍ': 'Pave',
                    'ㅛ': 'YO-yo',
                    'ㅕ': 'yo You',
                    'ㅑ': 'Ya I',
                    'ㅐ': 'Aero Ho Ho Ho',
                    'ㅔ': 'ape',
                    'ㅗ': 'Oh Oh OH',
                    'ㅓ': 'err John',
                    'ㅏ': 'Ark',
                    'ㅣ': 'Ill',
                    'ㅠ': 'Youtube',
                    'ㅜ': 'tun',
                    'ㅡ': 'umm'
                };
                
                memoMap = fallbackMemos;
            }

            // ---------- Update memo display (cleared on new character) ----------
            function clearMemoDisplay() {
                memoTextEl.innerText = '';
            }

            // ---------- Speech synthesis function ----------
            function speakKorean(text) {
                if (!text) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = text.match(/[ㄱ-ㅎㅏ-ㅣ가-힣]/) ? 'ko-KR' : 'en-US';
                utterance.rate = 0.8;
                utterance.pitch = 1.0;
                
                const voices = window.speechSynthesis.getVoices();
                const targetVoice = voices.find(voice => voice.lang === (text.match(/[ㄱ-ㅎㅏ-ㅣ가-힣]/) ? 'ko-KR' : 'en-US'));
                if (targetVoice) utterance.voice = targetVoice;
                
                window.speechSynthesis.speak(utterance);
            }

            // ---------- Auto-play sound function (respects toggle) ----------
            function autoSpeakKorean(text) {
                if (!autoPlayEnabled) return;
                speakKorean(text);
            }

            // Pre-load voices
            window.speechSynthesis.getVoices();

            // ---------- Render keyboard ----------
            function renderKeyboard() {
                const row1Keys = ['Q','W','E','R','T','Y','U','I','O','P'];
                const row2Keys = ['A','S','D','F','G','H','J','K','L'];
                const row3Keys = ['Z','X','C','V','B','N','M'];

                row1.innerHTML = '';
                row2.innerHTML = '';
                row3.innerHTML = '';

                row1Keys.forEach(letter => buildKey(letter, row1));
                row2Keys.forEach(letter => buildKey(letter, row2));
                row3Keys.forEach(letter => buildKey(letter, row3));
            }

            function buildKey(letter, parentRow) {
                const item = MAP[letter];
                if (!item) return;
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key';
                if (VOWELS.has(letter)) keyDiv.classList.add('vowel');
                keyDiv.dataset.letter = letter;
                keyDiv.innerHTML = `
                    <span class="korean">${item.kr}</span>
                    <span class="roman">${item.rom}</span>
                    <span class="eng">${letter}</span>
                `;
                
                keyDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    speakKorean(item.kr); // Korean sound
                });
                
                parentRow.appendChild(keyDiv);
            }

            // ---------- Highlight active key ----------
            function highlightKey(engLetter) {
                document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
                if (!engLetter) return;
                const target = Array.from(document.querySelectorAll('.key')).find(k => k.dataset.letter === engLetter);
                if (target) target.classList.add('active');
            }

            // ---------- Update hint visibility ----------
            function updateHintVisibility() {
                if (hintVisible) {
                    hintTextEl.classList.remove('hidden');
                } else {
                    hintTextEl.classList.add('hidden');
                }
            }

            // ---------- Generate random key that's different from previous ----------
            function getRandomKey() {
                // 排除上一個字母，避免連續重複
                let pool = previousEngKey ? ALL_KEYS.filter(key => key !== previousEngKey) : ALL_KEYS;
                if (pool.length === 0) pool = ALL_KEYS;

                // weight 當輪盤：weight 越高越常出現（與 ESFlash 同一套抽題方式）
                const w = pool.map(key => Math.max(WEIGHT_MIN, weightOf(MAP[key].kr)));
                const total = w.reduce((a, b) => a + b, 0);
                let r = Math.random() * total;
                for (let i = 0; i < pool.length; i++) {
                    r -= w[i];
                    if (r <= 0) return pool[i];
                }
                return pool[pool.length - 1];
            }

            // ---------- Set a new character (Korean pronunciation plays if Auto Play is ON) ----------
            function setNewCharacter() {
                const newKey = getRandomKey();
                
                // Update previous key before setting new one
                previousEngKey = currentEngKey;
                currentEngKey = newKey;
                
                const data = MAP[newKey];
                currentCharEl.innerText = data.kr;
                hintTextEl.innerText = `${data.rom} · press "${newKey}"`;
                highlightKey(newKey);
                canAnswer = true;
                
                // Clear the memo display - memo only appears on error
                clearMemoDisplay();
                paintWeight();
                
                // Play Korean pronunciation when new character appears (if Auto Play is ON)
                autoSpeakKorean(data.kr);
            }

            // ---------- Handle correct answer - CLEAR the memo ----------
            function handleCorrect() {
                if (!canAnswer) return;

                score += 1;
                scoreDisplay.innerText = score;
                feedbackMsgEl.innerText = '✅ Correct! +1';
                feedbackMsgEl.style.background = '#1f5f3a';
                
                // Clear the memo display on correct answer
                clearMemoDisplay();
                
                const currentKoreanChar = MAP[currentEngKey].kr;
                reportResult('correct');
                autoSpeakKorean(currentKoreanChar);
                
                canAnswer = false;

                setTimeout(() => {
                    setNewCharacter();
                    feedbackMsgEl.innerText = '⌨️ Type the letter...';
                    feedbackMsgEl.style.background = '#1c2c3b';
                }, 600);
            }

            // ---------- Handle wrong answer - Play Korean, wait 1 sec, then play memo ----------
            function handleWrong() {
                if (!canAnswer) return;
                
                feedbackMsgEl.innerText = '❌ Try again';
                feedbackMsgEl.style.background = '#9e2d2d';
                
                const currentKoreanChar = MAP[currentEngKey].kr;
                reportResult('wrong');

                // 1. Play the Korean pronunciation immediately
                autoSpeakKorean(currentKoreanChar);
                
                // 2. Check if there's a custom memo
                const memo = memoMap[currentKoreanChar];
                if (memo) {
                    // Show memo in the top bar
                    memoTextEl.innerText = memo;
                    
                    // Also show it in feedback temporarily
                    const originalMsg = feedbackMsgEl.innerText;
                    feedbackMsgEl.innerText = `📝 ${memo}`;
                    setTimeout(() => {
                        feedbackMsgEl.innerText = originalMsg;
                    }, 2000);
                    
                    // 3. Wait 1 second, then play memo sound (if Auto Play is ON)
                    if (autoPlayEnabled) {
                        setTimeout(() => {
                            speakKorean(memo);
                        }, 1000); // 1 second pause after Korean sound
                    }
                }
            }

            // ---------- Keydown handler ----------
            function onKeyDown(e) {
                // memo 編輯視窗開著時，所有鍵都交給視窗處理（空白鍵要能輸入空格）
                const modalOpen = memoModalEl && !memoModalEl.hidden;
                if (modalOpen) return;

                // Space = 念目前字母（跟點 🔊 一樣）
                if (e.code === 'Space' || e.key === ' ') {
                    if (e.altKey || e.ctrlKey || e.metaKey) return;
                    e.preventDefault();
                    playCurrentChar();
                    return;
                }

                const key = e.key.toUpperCase();
                if (e.altKey || e.ctrlKey || e.metaKey || key.length > 1) return;
                if (!MAP[key]) return;
                e.preventDefault();

                if (key === currentEngKey) {
                    handleCorrect();
                } else {
                    handleWrong();
                }

                const targetKey = Array.from(document.querySelectorAll('.key')).find(k => k.dataset.letter === key);
                if (targetKey) {
                    targetKey.style.background = '#f5e56b';
                    setTimeout(() => {
                        if (key === currentEngKey) {
                            targetKey.style.background = '';
                        } else {
                            targetKey.style.background = '';
                        }
                    }, 120);
                }
            }

            // ---------- Event listeners ----------
            window.addEventListener('keydown', onKeyDown);

            hintToggle.addEventListener('change', (e) => {
                hintVisible = e.target.checked;
                updateHintVisibility();
            });

            autoPlayToggle.addEventListener('change', (e) => {
                autoPlayEnabled = e.target.checked;
            });

            // 念目前這題的字母（🔊 按鈕與 Space 共用；不受 Auto 開關影響）
            function playCurrentChar() {
                if (!MAP[currentEngKey]) return;
                speakKorean(MAP[currentEngKey].kr);
                // Note: Memo is NOT played here - only on errors with 1 second delay
            }

            playButton.addEventListener('click', playCurrentChar);

            // ---------- Memo 編輯視窗（✏️） ----------
            const memoModalEl = document.getElementById('memoModal');
            const memoInputEl = document.getElementById('memoInput');
            const memoJamoEl = document.getElementById('memoJamo');
            const memoStatusEl = document.getElementById('memoStatus');
            const memoSaveBtn = document.getElementById('memoSave');
            const memoCancelBtn = document.getElementById('memoCancel');
            const memoEditBtn = document.getElementById('memoEdit');
            let memoModalJamo = '';

            function openMemoModal() {
                memoModalJamo = MAP[currentEngKey].kr;
                memoJamoEl.innerText = memoModalJamo;
                memoInputEl.value = memoMap[memoModalJamo] || '';
                memoStatusEl.innerText = '';
                memoStatusEl.className = 'modal-status';
                memoModalEl.hidden = false;
                memoSaveBtn.disabled = false;
                memoSaveBtn.innerText = 'Save';
                setTimeout(() => memoInputEl.focus(), 30);
            }

            function closeMemoModal() {
                memoModalEl.hidden = true;
                memoInputEl.blur();
            }

            async function saveMemoModal() {
                const jamo = memoModalJamo;
                const memo = memoInputEl.value.trim();
                memoSaveBtn.disabled = true;
                memoSaveBtn.innerText = 'Saving…';
                memoStatusEl.className = 'modal-status';
                memoStatusEl.innerText = '';
                try {
                    await saveRemoteMemo(jamo, memo);
                    memoMap[jamo] = memo;
                    // 目前這題就顯示剛剛存進去的內容，讓使用者立刻看到結果
                    if (MAP[currentEngKey] && MAP[currentEngKey].kr === jamo) {
                        memoTextEl.innerText = memo;
                    }
                    memoStatusEl.innerText = 'Saved ✓';
                    setTimeout(closeMemoModal, 500);
                } catch (e) {
                    memoStatusEl.className = 'modal-status err';
                    memoStatusEl.innerText = 'Save failed: ' + e.message;
                    memoSaveBtn.disabled = false;
                    memoSaveBtn.innerText = 'Save';
                }
            }

            memoEditBtn.addEventListener('click', openMemoModal);
            memoCancelBtn.addEventListener('click', closeMemoModal);
            memoSaveBtn.addEventListener('click', saveMemoModal);
            memoModalEl.addEventListener('click', (e) => {
                if (e.target === memoModalEl) closeMemoModal();
            });
            document.addEventListener('keydown', (e) => {
                if (memoModalEl.hidden) return;
                if (e.key === 'Escape') { e.preventDefault(); closeMemoModal(); }
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveMemoModal(); }
            }, true);

            // ---------- Initialize ----------
            async function init() {
                renderKeyboard();
                await loadMemoFile(); // This will try paths first, then fallback
                await loadRemoteMemos(); // 雲端 D1 版本覆蓋檔案內容
                setNewCharacter();
                score = 0;
                scoreDisplay.innerText = '0';
                hintVisible = true;
                hintToggle.checked = true;
                autoPlayEnabled = true;
                autoPlayToggle.checked = true;
                updateHintVisibility();
                clearMemoDisplay(); // Ensure memo is empty at start
            }

            init();

            document.addEventListener('touchstart', (e) => {
                if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') return;
            }, { passive: false });

        })();
    </script>
</body>
</html>
