<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Korean 505 · Dubeolsik Practice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #2b3a4a 0%, #1d2a35 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255,255,255,0.3);
            padding: 24px 20px 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2a36;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            color: white;
            font-weight: 600;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            gap: 8px;
            flex-wrap: wrap;
        }

        .score-box {
            background: #ffd966;
            color: #1e2a36;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #b38f40;
            white-space: nowrap;
        }

        .progress-badge {
            background: #4a627a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .progress-badge span {
            color: #ffd966;
            font-weight: 500;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #3a4c5e;
            padding: 6px 16px;
            border-radius: 40px;
            flex-wrap: wrap;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #e0e0e0;
        }

        .toggle-item input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: #95a5a6;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked {
            background: #2e7d32;
        }

        .toggle-item input[type="checkbox"]::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 0px;
            left: 0px;
            transition: 0.1s;
        }

        .toggle-item input[type="checkbox"]:checked::before {
            left: 16px;
        }

        .character-area {
            background: #eef3f7;
            border-radius: 60px;
            margin: 5px 0 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15);
            border: 3px solid white;
            position: relative;
            height: auto;
            min-height: 90px;
        }

        .korean-char {
            font-size: min(20vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            color: #1f3a4b;
            text-shadow: 3px 3px 0 #c9dae8;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: text;
            -webkit-user-select: text;
        }

        .combination-hint {
            font-size: 1rem;
            color: #4a627a;
            margin-top: 4px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .combination-hint.hidden {
            opacity: 0;
            visibility: hidden;
            height: 0;
            margin: 0;
        }

        .play-button {
            position: absolute;
            bottom: -15px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffd966;
            border: 4px solid white;
            box-shadow: 0 4px 0 #b38f40, 0 8px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.05s linear;
            z-index: 10;
        }

        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b38f40, 0 8px 15px rgba(0,0,0,0.2);
        }

        .play-button span {
            transform: scale(1.2);
            display: inline-block;
        }

        .keyboard-container {
            background: #d9e2ec;
            border-radius: 30px;
            padding: 20px 12px 15px;
            margin: 5px 0 20px;
            border: 2px solid white;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .key {
            background: white;
            border-radius: 16px;
            padding: 6px 0;
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 4px 0 #b0bec5, 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #f0f4fa;
            flex: 0 1 auto;
            transition: all 0.05s ease;
            cursor: pointer;
        }

        .key.active {
            background: #f5e56b;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b0bec5;
        }

        .key .korean {
            display: block;
            font-size: 1.2rem;
            color: #0f2a3b;
        }

        .key .roman {
            display: block;
            font-size: 0.65rem;
            color: #5c6f82;
            font-weight: 400;
        }

        .key .eng {
            display: block;
            font-size: 0.65rem;
            color: #aa00aa;
            font-weight: 600;
            text-transform: uppercase;
        }

        .key.vowel .korean {
            color: #b13e3e;
        }

        .input-area {
            background: #273a4b;
            border-radius: 40px;
            padding: 12px 20px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .input-label {
            font-weight: 500;
            color: #ffd966;
        }

        .input-display {
            background: #1e2a36;
            padding: 8px 16px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 4px;
            flex: 1;
            text-align: center;
            border: 2px solid #4a627a;
            min-height: 3rem;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0 10px;
            gap: 10px;
        }

        .message {
            background: #273a4b;
            padding: 10px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            flex: 1;
            font-size: 0.95rem;
            border-left: 6px solid #ffd966;
            user-select: text;
            -webkit-user-select: text;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .footer-note {
            text-align: center;
            color: #6c8aa3;
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: 400;
            user-select: text;
            -webkit-user-select: text;
        }

        .clear-btn {
            background: #4a627a;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 0 #1e2a36;
        }

        .clear-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .loading {
            text-align: center;
            color: #ffd966;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-bar">
            <div class="score-box" id="scoreDisplay">0</div>
            <div class="progress-badge" id="progressBadge">
                <span>📋</span>
                <span id="progressText">0/505</span>
            </div>
            <div class="toggle-group">
                <div class="toggle-item">
                    <span>🔤 Hint</span>
                    <input type="checkbox" id="hintToggle" checked>
                </div>
                <div class="toggle-item">
                    <span>🔊 Sound</span>
                    <input type="checkbox" id="soundToggle" checked>
                </div>
            </div>
        </div>

        <div class="character-area">
            <div class="korean-char" id="currentChar">⋯</div>
            <div class="combination-hint" id="combinationHint">loading...</div>
            <div class="play-button" id="playButton" title="Pronounce this character">
                <span>🔊</span>
            </div>
        </div>

        <div class="input-area">
            <span class="input-label">⌨️ 입력:</span>
            <div class="input-display" id="inputDisplay"></div>
            <button class="clear-btn" id="clearInputBtn">✖ 지우기</button>
        </div>

        <!-- Keyboard in QWERTY layout -->
        <div class="keyboard-container">
            <div class="key-row" id="row1"></div>
            <div class="key-row" id="row2"></div>
            <div class="key-row" id="row3"></div>
        </div>

        <div class="feedback-area">
            <div class="message" id="feedbackMsg">📂 Loading 505 characters...</div>
        </div>
        
        <div class="footer-note">Dubeolsik · 505 characters from KRChars505.txt · 動態底線 · 錯誤提示保留</div>
    </div>

    <script>
        (function() {
            // ---------- QWERTY to Korean mapping (same as before) ----------
            const MAP = {
                'Q': { kr: 'ㅂ', rom: 'b' },
                'W': { kr: 'ㅈ', rom: 'j' },
                'E': { kr: 'ㄷ', rom: 'd' },
                'R': { kr: 'ㄱ', rom: 'g' },
                'T': { kr: 'ㅅ', rom: 's' },
                'Y': { kr: 'ㅛ', rom: 'yo' },
                'U': { kr: 'ㅕ', rom: 'yeo' },
                'I': { kr: 'ㅑ', rom: 'ya' },
                'O': { kr: 'ㅐ', rom: 'ae' },
                'P': { kr: 'ㅔ', rom: 'e' },
                'A': { kr: 'ㅁ', rom: 'm' },
                'S': { kr: 'ㄴ', rom: 'n' },
                'D': { kr: 'ㅇ', rom: 'ng' },
                'F': { kr: 'ㄹ', rom: 'r/l' },
                'G': { kr: 'ㅎ', rom: 'h' },
                'H': { kr: 'ㅗ', rom: 'o' },
                'J': { kr: 'ㅓ', rom: 'eo' },
                'K': { kr: 'ㅏ', rom: 'a' },
                'L': { kr: 'ㅣ', rom: 'i' },
                'Z': { kr: 'ㅋ', rom: 'k' },
                'X': { kr: 'ㅌ', rom: 't' },
                'C': { kr: 'ㅊ', rom: 'ch' },
                'V': { kr: 'ㅍ', rom: 'p' },
                'B': { kr: 'ㅠ', rom: 'yu' },
                'N': { kr: 'ㅜ', rom: 'u' },
                'M': { kr: 'ㅡ', rom: 'eu' }
            };

            // Vowels set for color coding
            const VOWELS = new Set(['Y','U','I','O','P','H','J','K','L','B','N','M']);

            // ---------- Memo hints from KRCMemo.txt (embedded) ----------
            const MEMO_MAP = {
                'q': 'ㅂ boutique',
                'w': 'ㅈ JaW',
                'e': 'ㄷ DEad',
                'r': 'ㄱ Grrrr',
                't': 'ㅅ Sit',
                'a': 'ㅁ MamA',
                's': 'ㄴ North South',
                'd': 'ㅇ O D Overdose',
                'f': 'ㄹ two leaf',
                'g': 'ㅎ Hug',
                'z': 'ㅋ Kizz',
                'x': 'ㅌ Tax',
                'c': 'ㅊ Chill',
                'v': 'ㅍ Pave',
                'y': 'ㅛ YO-yo',
                'u': 'ㅕ yo You',
                'i': 'ㅑ Ya I',
                'o': 'ㅐ Aero Ho Ho Ho',
                'p': 'ㅔ ape',
                'h': 'ㅗ Oh Oh OH',
                'j': 'ㅓ urge; jean',
                'k': 'ㅏ Ark',
                'l': 'ㅣ Ill',
                'b': 'ㅠ Youtube',
                'n': 'ㅜ tun',
                'm': 'ㅡ umm',
                'R': 'ㄲ kk',
                'E': 'ㄸ tt DEad GEt',
                'Q': 'ㅃ pp boutique PaQ',
                'T': 'ㅆ ss Sit',
                'W': 'ㅉ jj Jaw',
                'O': 'ㅒ yae Yellow',
                'P': 'ㅖ ye yape'
            };

            // ---------- State ----------
            let QUIZ_LIST = [];                // will be loaded from file
            let currentIndex = 0;
            let currentQuiz = null;
            let userInput = '';
            let score = 0;
            let hintEnabled = true;
            let soundEnabled = true;
            let canType = false;                // start false until data loaded
            let totalChars = 0;
            
            // 儲存最後的錯誤訊息，避免被清除
            let lastErrorMsg = '';

            // DOM elements
            const currentCharEl = document.getElementById('currentChar');
            const combinationHintEl = document.getElementById('combinationHint');
            const inputDisplayEl = document.getElementById('inputDisplay');
            const feedbackMsgEl = document.getElementById('feedbackMsg');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const progressText = document.getElementById('progressText');
            const hintToggle = document.getElementById('hintToggle');
            const soundToggle = document.getElementById('soundToggle');
            const playButton = document.getElementById('playButton');
            const clearBtn = document.getElementById('clearInputBtn');
            const row1 = document.getElementById('row1');
            const row2 = document.getElementById('row2');
            const row3 = document.getElementById('row3');

            // ---------- Helper: speak text ----------
            function speakText(text, lang = 'ko-KR') {
                if (!soundEnabled) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }

            // ---------- Render keyboard ----------
            function renderKeyboard() {
                const row1Keys = ['Q','W','E','R','T','Y','U','I','O','P'];
                const row2Keys = ['A','S','D','F','G','H','J','K','L'];
                const row3Keys = ['Z','X','C','V','B','N','M'];

                row1.innerHTML = '';
                row2.innerHTML = '';
                row3.innerHTML = '';

                row1Keys.forEach(letter => buildKey(letter, row1));
                row2Keys.forEach(letter => buildKey(letter, row2));
                row3Keys.forEach(letter => buildKey(letter, row3));
            }

            function buildKey(letter, parentRow) {
                const item = MAP[letter];
                if (!item) return;
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key';
                if (VOWELS.has(letter)) keyDiv.classList.add('vowel');
                keyDiv.dataset.letter = letter;
                keyDiv.innerHTML = `
                    <span class="korean">${item.kr}</span>
                    <span class="roman">${item.rom}</span>
                    <span class="eng">${letter}</span>
                `;
                
                keyDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    speakText(item.kr);
                });
                
                parentRow.appendChild(keyDiv);
            }

            // ---------- 根據組合長度生成底線 ----------
            function getUnderlineString(comboLength) {
                return '＿'.repeat(comboLength);  // 使用全形底線更明顯
            }

            // ---------- Update input display with dynamic underlines ----------
            function updateInputDisplay() {
                if (!currentQuiz) {
                    inputDisplayEl.innerText = '______';
                    return;
                }
                
                const comboLength = currentQuiz.combo.length;
                const underlines = getUnderlineString(comboLength);
                
                if (userInput === '') {
                    inputDisplayEl.innerText = underlines;
                } else {
                    // 顯示已輸入的字符，後面補上剩餘數量的底線
                    const remainingCount = comboLength - userInput.length;
                    const remainingUnderlines = remainingCount > 0 ? '＿'.repeat(remainingCount) : '';
                    inputDisplayEl.innerText = userInput + remainingUnderlines;
                }
            }

            // ---------- Load quiz data from KRChars505.txt ----------
            async function loadQuizData() {
                try {
                    const response = await fetch('KRChars505.txt');
                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }
                    const text = await response.text();
                    parseQuizData(text);
                } catch (error) {
                    console.error('Failed to load KRChars505.txt:', error);
                    feedbackMsgEl.innerText = '❌ Failed to load KRChars505.txt. Using fallback data.';
                    // Fallback to first 20 entries from original list
                    useFallbackData();
                }
            }

            function parseQuizData(text) {
                const lines = text.split('\n');
                QUIZ_LIST = [];
                
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith('#')) continue; // skip empty lines and header
                    
                    const parts = line.split('\t');
                    if (parts.length >= 4) {
                        // Format: # Korean Dubeolsik RR
                        const korean = parts[1].trim();
                        const combo = parts[2].trim();
                        const roma = parts[3].trim();
                        
                        if (korean && combo && roma) {
                            QUIZ_LIST.push({ char: korean, combo: combo, roma: roma });
                        }
                    }
                }
                
                if (QUIZ_LIST.length === 0) {
                    throw new Error('No valid entries found');
                }
                
                totalChars = QUIZ_LIST.length;
                progressText.innerText = `1/${totalChars}`;
                feedbackMsgEl.innerText = `✅ Loaded ${totalChars} characters. Start typing!`;
                
                // Enable typing and load first quiz
                canType = true;
                loadQuiz();
            }

            function useFallbackData() {
                // Fallback to first 20 entries from original list
                QUIZ_LIST = [
                    { char: '은', combo: 'dms', roma: 'eun' },
                    { char: '는', combo: 'sms', roma: 'neun' },
                    { char: '이', combo: 'dl', roma: 'i' },
                    { char: '도', combo: 'eh', roma: 'do' },
                    { char: '일', combo: 'dlf', roma: 'il' },
                    { char: '수', combo: 'tn', roma: 'su' },
                    { char: '지', combo: 'wl', roma: 'ji' },
                    { char: '한', combo: 'gks', roma: 'han' },
                    { char: '로', combo: 'fh', roma: 'ro' },
                    { char: '그', combo: 'rm', roma: 'geu' },
                    { char: '를', combo: 'fmf', roma: 'reul' },
                    { char: '대', combo: 'eo', roma: 'dae' },
                    { char: '사', combo: 'tk', roma: 'sa' },
                    { char: '인', combo: 'dls', roma: 'in' },
                    { char: '년', combo: 'sjs', roma: 'nyeon' },
                    { char: '월', combo: 'dnjf', roma: 'wol' },
                    { char: '세', combo: 'tp', roma: 'se' },
                    { char: '시', combo: 'tl', roma: 'si' },
                    { char: '분', combo: 'qns', roma: 'bun' },
                    { char: '의', combo: 'dml', roma: 'ui' }
                ];
                totalChars = QUIZ_LIST.length;
                progressText.innerText = `1/${totalChars}`;
                canType = true;
                loadQuiz();
            }

            // ---------- Update UI with current quiz ----------
            function loadQuiz() {
                currentQuiz = QUIZ_LIST[currentIndex];
                currentCharEl.innerText = currentQuiz.char;
                combinationHintEl.innerText = `${currentQuiz.combo} · ${currentQuiz.roma}`;
                userInput = '';
                updateInputDisplay();
                
                // Update progress
                progressText.innerText = `${currentIndex + 1}/${totalChars}`;

                // Auto-speak if sound on
                if (soundEnabled) {
                    speakText(currentQuiz.char);
                }

                // Remove active highlights from keys
                document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
                
                // 清除最後的錯誤訊息，但不影響 feedbackMsg（如果是正確情況）
                lastErrorMsg = '';
            }

            // ---------- Clear input manually (保留提示訊息) ----------
            function clearInput() {
                userInput = '';
                updateInputDisplay();
                // 不清除 feedbackMsg，保留最後的提示
            }

            // ---------- Build error hint string from wrong keys ----------
            function buildErrorHint() {
                if (!hintEnabled) return '';
                const wrongCombo = userInput;
                let hintParts = [];
                for (let ch of wrongCombo) {
                    const lower = ch.toLowerCase();
                    const memo = MEMO_MAP[lower];
                    if (memo) {
                        hintParts.push(`[${lower}: ${memo}]`);
                    } else {
                        hintParts.push(`[${lower}: ?]`);
                    }
                }
                return hintParts.join(' ');
            }

            // ---------- Handle keystroke ----------
            function onKeyDown(e) {
                if (!canType || !currentQuiz) return;

                const key = e.key;
                if (!/^[a-zA-Z]$/.test(key)) return;
                e.preventDefault();

                const lowerKey = key.toLowerCase();

                // Add to user input
                userInput += lowerKey;
                updateInputDisplay();

                const correctCombo = currentQuiz.combo;

                // If userInput length exceeds correct combo length -> definitely wrong
                if (userInput.length > correctCombo.length) {
                    const errorHint = buildErrorHint();
                    if (hintEnabled && errorHint) {
                        lastErrorMsg = `❌ Error ${errorHint}`;
                    } else {
                        lastErrorMsg = `❌ Error`;
                    }
                    feedbackMsgEl.innerText = lastErrorMsg;
                    feedbackMsgEl.style.background = '#9e2d2d';

                    canType = false;
                    setTimeout(() => {
                        clearInput();  // 清除輸入欄，但保留提示訊息
                        canType = true;
                    }, 1500);
                    return;
                }

                // Check if userInput matches the prefix of correct combo
                for (let i = 0; i < userInput.length; i++) {
                    if (userInput[i] !== correctCombo[i]) {
                        const errorHint = buildErrorHint();
                        if (hintEnabled && errorHint) {
                            lastErrorMsg = `❌ Error ${errorHint}`;
                        } else {
                            lastErrorMsg = `❌ Error`;
                        }
                        feedbackMsgEl.innerText = lastErrorMsg;
                        feedbackMsgEl.style.background = '#9e2d2d';

                        canType = false;
                        setTimeout(() => {
                            clearInput();  // 清除輸入欄，但保留提示訊息
                            canType = true;
                        }, 1500);
                        return;
                    }
                }

                // If full match -> correct!
                if (userInput === correctCombo) {
                    score += 1;
                    scoreDisplay.innerText = score;
                    feedbackMsgEl.innerText = '✅ Correct! +1';
                    feedbackMsgEl.style.background = '#1f5f3a';

                    if (soundEnabled) {
                        speakText(currentQuiz.char);
                    }

                    canType = false;

                    // Move to next quiz after short delay
                    setTimeout(() => {
                        currentIndex = (currentIndex + 1) % QUIZ_LIST.length;
                        loadQuiz();
                        feedbackMsgEl.innerText = '⌨️ Type the combination ...';
                        feedbackMsgEl.style.background = '#273a4b';
                        canType = true;
                    }, 800);
                } else {
                    // Partial match
                    feedbackMsgEl.innerText = `⌨️ Continue... (${userInput.length}/${correctCombo.length})`;
                    feedbackMsgEl.style.background = '#273a4b';
                }
            }

            // ---------- Event listeners ----------
            window.addEventListener('keydown', onKeyDown);

            hintToggle.addEventListener('change', (e) => {
                hintEnabled = e.target.checked;
            });

            soundToggle.addEventListener('change', (e) => {
                soundEnabled = e.target.checked;
            });

            playButton.addEventListener('click', () => {
                if (currentQuiz) {
                    speakText(currentQuiz.char);
                }
            });

            clearBtn.addEventListener('click', () => {
                clearInput();
                // 手動清除時可以選擇是否保留提示，這裡保留
            });

            // Virtual keyboard clicks
            function setupKeyClickListeners() {
                document.querySelectorAll('.key').forEach(key => {
                    key.addEventListener('click', (e) => {
                        const letter = key.dataset.letter;
                        if (letter && canType && currentQuiz) {
                            const fakeEvent = { key: letter, preventDefault: () => {} };
                            onKeyDown(fakeEvent);
                        }
                    });
                });
            }

            // ---------- Initialize ----------
            async function init() {
                renderKeyboard();
                // Wait a tick for keyboard to render, then attach click listeners
                setTimeout(setupKeyClickListeners, 100);
                
                // Load quiz data from file
                await loadQuizData();
                
                // Initialize score display
                scoreDisplay.innerText = '0';
                hintEnabled = true;
                soundEnabled = true;
                hintToggle.checked = true;
                soundToggle.checked = true;
            }

            init();
        })();
    </script>
</body>
</html>
